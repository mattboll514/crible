name: Publish the image

# Publication of the server image of Crible on GHCR, under the policy of
# ADR-0133 (`docs/07-stack-et-deploiement.md`, section "CI (GitHub Actions)",
# task PUBLIER-IMAGE).
#
# Only a `v*` tag builds and publishes: a push to a branch never touches the
# registry. The first tag is pushed by the owner, never by an agent.
#
# Two native runners instead of one emulated job. An arm64 release build of the
# Rust workspace under QEMU on an amd64 runner takes tens of minutes; the
# repository is public, so `ubuntu-24.04-arm` is free (ADR-0133, decision 3).
# Each build job pushes one image by digest, and a third job assembles the
# manifest list, which is the multi-platform pattern documented by
# `docker/build-push-action`.

on:
  push:
    tags:
      - "v*"

# Publications are serialised without ever cancelling one: a cancelled run can
# leave a digest pushed without its manifest list (ADR-0133, decision 5). The
# order is not guaranteed, and is not needed: decision 4 below, and it alone,
# keeps `:cpu` from moving backwards.
concurrency:
  group: publish-image
  cancel-in-progress: false

# Minimal permissions: the checkout reads, the two publishing jobs write the
# packages of the repository. No other secret than the automatic `GITHUB_TOKEN`
# (ADR-0133, decision 6).
permissions:
  contents: read

jobs:
  meta:
    name: Image name, version and moving tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.value }}
      move_cpu: ${{ steps.version.outputs.move_cpu }}
    steps:
      # The tag list decides whether `:cpu` moves (ADR-0133, decision 4): the
      # job needs the whole history and every tag, not the single tag of the
      # push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # GHCR requires a lowercase repository name, and `github.repository_owner`
      # keeps the case of the account: the owner is lowercased here, once, and
      # never written out.
      - name: Compute the image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          lower="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${lower}/crible" >> "$GITHUB_OUTPUT"
      # The guard of ADR-0133, decision 2: the tag must be `v` followed by the
      # workspace version, so a mistaken tag fails before any build instead of
      # publishing an image whose label lies.
      #
      # `<version>`, the image tag, is the tag without its `v`: `v0.1.0`
      # publishes `0.1.0`, because the `v` is a version control convention that
      # no image reference needs.
      #
      # `:cpu` is the moving tag of the latest *stable* release, and it is moved
      # only when this very tag is the highest stable `vX.Y.Z` tag of the
      # repository (ADR-0133, decision 4). A pre-release, a Cargo version with a
      # `-`, publishes its own tag and never moves `:cpu`; a fix of an older
      # version publishes its own tag and leaves `:cpu` in place.
      - name: Check the tag and decide whether the moving tag moves
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p')"
          if [ -z "${workspace_version}" ]; then
            echo "the workspace version is missing from Cargo.toml" >&2
            exit 1
          fi
          if [ "${TAG}" != "v${workspace_version}" ]; then
            echo "the tag ${TAG} does not match the workspace version ${workspace_version}" >&2
            exit 1
          fi
          version="${TAG#v}"
          move_cpu=false
          highest=none
          case "${version}" in
            *-*) echo "pre-release ${version}: the moving tag stays in place" ;;
            *)
              # Compared as versions, not as text: `v0.10.0` is above `v0.9.0`.
              # `sort -V` orders the stable tags; pre-releases are filtered out
              # before the sort, so they can never win.
              highest="$(git tag --list 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 || true)"
              if [ "${highest}" = "${TAG}" ]; then
                move_cpu=true
              else
                echo "an older stable tag ${highest:-none} is still the highest: the moving tag stays in place"
              fi
              ;;
          esac
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "move_cpu=${move_cpu}" >> "$GITHUB_OUTPUT"
          echo "version ${version}, highest stable tag ${highest}, move_cpu ${move_cpu}"

  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    # A cold build of the workspace, `cargo-chef` included, fits in fifteen
    # minutes on a native runner; an hour and a half leaves room for a loaded
    # runner and an ONNX Runtime download.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      # Both architectures run to the end even when the first one fails: the two
      # failures are then visible in the same run, and the second build is not
      # cancelled halfway. Nothing is assembled either way, since `merge` needs
      # both.
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: linux-arm64
          - platform: linux/amd64
            runner: ubuntu-latest
            cache: linux-amd64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No tag on this push: the image is named by its digest, and the `merge`
      # job gives the tags to the manifest list. One cache scope per
      # architecture, so the two jobs never overwrite each other's layers.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # `push=true` inside `outputs`, without the `push` input as well: the
          # two would ask buildx for the same thing twice and conflict.
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.cache }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the manifest list
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `imagetools create` writes no layer: it points the tags at the manifest
      # list of the two digests, so `docker pull` picks the image of the
      # architecture it runs on. The moving tag is written only when `meta`
      # decided it must move (ADR-0133, decision 4).
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
          MOVE_CPU: ${{ needs.meta.outputs.move_cpu }}
        run: |
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "${MOVE_CPU}" = "true" ]; then
            tags+=(--tag "${IMAGE}:cpu")
          fi
          digests=()
          for file in *; do
            digests+=("${IMAGE}@sha256:${file}")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
      - name: Inspect the manifest list
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

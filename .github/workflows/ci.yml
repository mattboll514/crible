name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Complement of 2026-11-01 to ADR-0068: the CI keeps no debug information, so
  # `target/` stays smaller and linking writes less to the disk of the runner.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `docker/Dockerfile` pins the toolchain of `rust-toolchain.toml` in
      # `ARG RUST_VERSION`, and the two `toolchain:` fields of this workflow
      # repeat the same version: a comment was the only link between the three
      # values, and a bump of the channel that forgot one of them would build
      # the server with another compiler. The check runs before anything is
      # built.
      - name: Check that every Rust toolchain pin matches rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          version=$(sed -n 's/^ARG RUST_VERSION=\(.*\)$/\1/p' docker/Dockerfile)
          pins=$(sed -n 's/^ *toolchain: "\(.*\)"$/\1/p' .github/workflows/ci.yml)
          if [ -z "$channel" ] || [ -z "$version" ]; then
            echo "cannot read the channel of rust-toolchain.toml ('$channel') or ARG RUST_VERSION of docker/Dockerfile ('$version')"
            exit 1
          fi
          if [ "$channel" != "$version" ]; then
            echo "docker/Dockerfile pins Rust $version, rust-toolchain.toml names channel $channel: update ARG RUST_VERSION"
            exit 1
          fi
          found=$(printf '%s\n' "$pins" | grep -c . || true)
          if [ "$found" -ne 2 ]; then
            echo "expected two toolchain pins in .github/workflows/ci.yml, found $found ('$pins')"
            exit 1
          fi
          for pin in $pins; do
            if [ "$pin" != "$channel" ]; then
              echo ".github/workflows/ci.yml pins Rust $pin, rust-toolchain.toml names channel $channel: update toolchain: in .github/workflows/ci.yml"
              exit 1
            fi
          done
      # Complement of 2026-11-01 to ADR-0068: several feature sets are linked in
      # one `target/`, and the disk of the runner fills up. The SDKs the project
      # does not use are removed, and the free space is measured before and after.
      # A missing directory is not an error.
      - name: Free the disk of the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      # ADR-0114, decision 1: a broken intra-doc link fails at the push that
      # writes it. `RUSTDOCFLAGS` is set on this step only, and the step runs
      # with the default features, without `--document-private-items`.
      - name: Check the documentation links
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Generate the synthetic dataset
        working-directory: tools
        run: |
          uv sync
          uv run python gen_synth.py --out ../data/synth-small
          uv run python reference_topk.py --dataset ../data/synth-small
      - name: Test
        run: cargo test --locked
      # The failpoint tests of INV-02, INV-03, INV-04 and INV-14 only exist with
      # the `failpoints` cargo feature: without these two steps they never run in CI.
      - name: Lint the failpoint build
        run: cargo clippy -p crible-store --all-targets --locked --features failpoints -- -D warnings
      - name: Test the failpoint build
        run: cargo test -p crible-store --locked --features failpoints
      # `compaction_recovery` arms the store failpoint through the server's own
      # `failpoints` feature (complement of 2026-10-29 to ADR-0068, decision 2):
      # without these two steps the recovery of ADR-0108 is never run in CI.
      # `crible` carries the same feature, forwarded to `crible-store`: the CLI
      # tests that count the openings of the dense readers only exist with it
      # (ADR-0126, decision 6).
      - name: Lint the server failpoint build
        run: cargo clippy -p crible-server -p crible --all-targets --locked --features failpoints -- -D warnings
      - name: Test the server failpoint build
        run: cargo test -p crible-server -p crible --locked --features failpoints
      - name: Test the Python client against the binary
        working-directory: clients/python
        env:
          CRIBLE_BIN: ${{ github.workspace }}/target/debug/crible
        run: |
          uv sync
          uv run pytest -m server
      # Complement of 2026-11-01 to ADR-0068: the free space at the end of the job
      # confirms or refutes the diagnosis of the run 41343484760.
      - name: Report the disk of the runner
        if: always()
        run: df -h /

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect Python client
        id: detect
        run: |
          if [ -f clients/python/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
      - name: Run pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: clients/python
        run: |
          uv sync
          uv run pytest

  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run tools tests
        working-directory: tools
        run: |
          uv sync --group ci
          uv run pytest -rs

  rust-onnx:
    name: Rust with ONNX Runtime
    runs-on: ubuntu-latest
    # 4 min 20 s on the first cold run (40118324771, no model cache): 20 minutes
    # leave room for a slow Hugging Face download and a loaded runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Generate the synthetic dataset
        working-directory: tools
        run: |
          uv sync
          uv run python gen_synth.py --out ../data/synth-small
          uv run python reference_topk.py --dataset ../data/synth-small
      - name: Install the CI group
        working-directory: tools
        run: uv sync --group ci
      - name: Expose the ONNX Runtime of the wheel
        working-directory: tools
        run: |
          library="$(uv run python -c 'import onnxruntime, pathlib; print(pathlib.Path(onnxruntime.__file__).parent / "capi" / "libonnxruntime.so.1.31.0")')"
          test -f "$library"
          echo "ORT_DYLIB_PATH=$library" >> "$GITHUB_ENV"
      - name: Validate the manifest and compute the cache key
        id: artifact
        working-directory: tools
        run: echo "key=$(uv run python fetch_model_artifact.py cache-key)" >> "$GITHUB_OUTPUT"
      # The cache is never a source of trust: the fetch step verifies every
      # restored file against the manifest, exactly like a fresh download. A
      # divergent or incomplete restored cache fails there and names the key to
      # purge. A complete cache is therefore verified in place, and a missing one
      # is downloaded; an incomplete cache is never completed silently, because
      # an Actions cache key cannot be overwritten with a new content.
      - name: Restore the model artifact
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/models/mdenseon
          key: ${{ runner.os }}-${{ steps.artifact.outputs.key }}
      - name: Fetch and verify the model artifact
        working-directory: tools
        run: uv run python fetch_model_artifact.py --dest ../data/models/mdenseon
      # No save step here: `.github/workflows/model-cache.yml` is the only writer of this cache (ADR-0059).
      # Seven tests stay local, excluded by name one by one, for two reasons.
      # The five Legifacile sample tests read production-derived data (ADR-0032):
      # inv_12_the_legifacile_sample_passes_the_acceptance_check,
      # inv_09_legifacile_sample_queries_return_the_same_results_after_compaction,
      # inv_08_legifacile_sample_queries_return_the_same_results_after_export_and_import,
      # inv_12_the_reference_batch_acceptance_statistics_are_unchanged and
      # api_and_cli_return_the_same_results_on_the_legifacile_sample
      # (ADR-0057, ADR-0062, ADR-0063, ADR-0085, ADR-0109). The two clean-stop
      # tests need Docker and an image built locally, which the runner does not have:
      # inv_03_a_docker_stop_during_an_attach_leaves_one_complete_generation and
      # inv_04_a_docker_stop_during_an_attach_leaves_the_last_committed_generation
      # (ADR-0132). Keep this command identical to docs/07-stack-et-deploiement.md.
      - name: Test with ONNX Runtime
        run: cargo test --locked --workspace -- --include-ignored --skip inv_12_the_legifacile_sample_passes_the_acceptance_check --skip inv_09_legifacile_sample_queries_return_the_same_results_after_compaction --skip inv_08_legifacile_sample_queries_return_the_same_results_after_export_and_import --skip inv_12_the_reference_batch_acceptance_statistics_are_unchanged --skip api_and_cli_return_the_same_results_on_the_legifacile_sample --skip inv_03_a_docker_stop_during_an_attach_leaves_one_complete_generation --skip inv_04_a_docker_stop_during_an_attach_leaves_the_last_committed_generation

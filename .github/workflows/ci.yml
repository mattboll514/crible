name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Generate the synthetic dataset
        working-directory: tools
        run: |
          uv sync
          uv run python gen_synth.py --out ../data/synth-small
          uv run python reference_topk.py --dataset ../data/synth-small
      - name: Test
        run: cargo test --locked
      - name: Test the Python client against the binary
        working-directory: clients/python
        env:
          CRIBLE_BIN: ${{ github.workspace }}/target/debug/crible
        run: |
          uv sync
          uv run pytest tests/test_online_batch.py

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect Python client
        id: detect
        run: |
          if [ -f clients/python/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
      - name: Run pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: clients/python
        run: |
          uv sync
          uv run pytest

  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run tools tests
        working-directory: tools
        run: |
          uv sync
          uv run pytest

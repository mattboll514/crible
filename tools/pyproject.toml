[project]
name = "crible-tools"
version = "0.0.0"
description = "Offline tools for Crible (benchmarks, synthetic data, ONNX export)."
requires-python = ">=3.11"
dependencies = ["blake3>=1.0", "crible", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]
# Runtime of the Rust ONNX tests in CI (ADR-0057). It carries the ONNX Runtime
# wheel the tests load through `ORT_DYLIB_PATH`, and the tokenizer the MES-04
# comparison tests need. It never carries `torch`: this is the runtime, not the
# export chain. Install it with `uv sync --group ci`.
ci = [
    # Exact pin (ADR-0057): the version of the `export` field of `model.json`.
    "onnxruntime==1.31.0",
    # `tools/bench/mes04/tests/test_compare_onnx.py` skips without it.
    "tokenizers>=0.22.2",
]
# ONNX export is the only part of `tools/` that needs a model runtime. It stays
# out of the default environment, which CI and the tests use without PyTorch
# (`docs/07-stack-et-deploiement.md`): install it with `uv sync --group export`.
export = [
    "huggingface-hub>=0.36.2",
    # `torch.onnx.export` writes the graph, `onnx` inspects it; no `optimum`
    # (ADR-0050): `optimum-onnx` 0.1.0 caps `transformers` below 4.58.
    "onnx>=1.18",
    "onnxruntime>=1.18",
    # The dynamo exporter of `torch.onnx.export` needs `onnxscript` (ADR-0050).
    "onnxscript>=0.5",
    "tokenizers>=0.22.2",
    "torch>=2.14.1",
    # Exact pin (ADR-0050): this is the version that produced the production
    # vectors of Legifacile. Raising it requires a new fidelity measurement.
    "transformers==5.14.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
# CPU-only wheels: the project never uses a GPU, and the default PyPI wheel of
# `torch` pulls the CUDA stack on Linux (several GB).
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
crible = { path = "../clients/python", editable = true }
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests", "bench/mes00/tests", "bench/mes01/tests", "bench/mes02/tests", "bench/mes03/tests", "bench/mes04/tests", "bench/mes06/tests"]
pythonpath = [".", "bench/mes00", "bench/mes01", "bench/mes02", "bench/mes03", "bench/mes04", "bench/mes06"]

# Example instance configuration of the Crible server.
#
# This file is the model of the container of `docker/README.md`: every key of
# `docs/07-stack-et-deploiement.md` ("Configuration de l'instance") is present,
# the three roots point to the directories the image declares, and the loader
# accepts it as is (`crates/crible-server/tests/example_config.rs`). No value
# here belongs to a deployment: the API keys are empty, so the instance starts
# closed and every authenticated route answers `401`.
#
# For a real deployment, copy this file outside the repository, generate the
# keys with `crible key generate` (ADR-0100) and mount the copy as
# `/etc/crible/crible.toml`, read-only. The server never starts on implicit
# defaults: a missing or unreadable file is a startup fault (ADR-0031, ADR-0097).
#
# Every key can be overridden by an environment variable: `CRIBLE_` followed by
# the key path in upper case, the sections separated by `__`, for example
# `CRIBLE_SERVER__BIND` or `CRIBLE_LIMITS__QUERY_CACHE_ENTRIES` (ADR-0097).

[server]
# `0.0.0.0` inside the container: the port is published by `docker run -p`.
bind = "0.0.0.0:8080"
search_threads = 0            # 0 = number of cores
max_concurrent_searches = 0   # 0 = 2 × cores

[paths]
# The three volumes of `docs/07`, section "Docker": `/data` and `/models` are
# named volumes, `/exchange` is a directory mounted from the host.
data = "/data"
models = "/models"
exchange = "/exchange"

[auth]
# Empty on purpose: this example holds no secret and no digest of a deployment.
# Add one entry per key, with the digest printed by `crible key generate`:
#
#   [[auth.keys]]
#   name = "legifacile-mcp"
#   role = "read"       # read, write or admin
#   sha256 = "…"        # 64 lowercase hexadecimal characters (ADR-0100)
#
# An empty list is accepted: the server starts and warns once, and every
# authenticated route answers `401` (ADR-0100, decision 4).
keys = []

[analytics]
retention_days = 90

[debug_journal]
enabled = false
sample_rate = 0.0            # fraction of the requests WITHOUT `debug: true`, in [0, 1]
ttl_days = 7                 # 0 is refused at startup (ADR-0122)
max_rows = 500000            # 0 is refused at startup (ADR-0127)
max_bytes = 2147483648       # 2 GiB, the USED size of debug.sqlite (ADR-0127)

[encoder]
query_precision = "fp32"      # "fp32" | "int8" (ADR-0052)

[limits]
writer_queue = 16             # queued jobs per index, the running one excluded (ADR-0103)
default_timeout_ms = 2000
# Bounds `?wait=true` and the wait of the write jobs at shutdown (ADR-0067,
# ADR-0104): the stop timeout of the container must stay above it, and the
# `docker run` of `docker/README.md` passes `--stop-timeout 65`.
wait_timeout_ms = 60000
query_cache_entries = 1024    # LRU of the queries, per instance, never persisted (ADR-0051)

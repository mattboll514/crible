[workspace]
resolver = "3"
members = [
    "crates/crible",
    "crates/crible-core",
    "crates/crible-encode",
    "crates/crible-search",
    "crates/crible-server",
    "crates/crible-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# HTTP server
axum = { version = "=0.8.9" }
tokio = { version = "=1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
    # `sync` carries the `watch` channel that asks the server to stop. It is
    # listed with the other features in the complement of 2026-10-29 to
    # ADR-0096, and it adds no crate.
    "sync",
] }
tower = { version = "=0.5.3" }
tower-http = { version = "=0.7.1", features = [
    "trace",
    # `limit`: the global body bound of ADR-0102, decision 1.
    "limit",
    # `catch-panic`: a panicking handler renders a `500` (ADR-0102, decision 4).
    "catch-panic",
] }

# OpenAPI
utoipa = { version = "=6.0.0" }
utoipa-swagger-ui = { version = "=10.0.1" }

# Snapshots and parallelism
arc-swap = { version = "=1.9.3" }
rayon = { version = "=1.12.0" }

# Encoding
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "=0.23.2" }

# Vectors
memmap2 = { version = "=0.9.11" }
half = { version = "=2.7.1" }

# Filters and storage
roaring = { version = "=0.11.5" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
zstd = { version = "=0.14.3" }

# Lexical search and batch format
tantivy = { version = "=0.27.0" }
arrow = { version = "=60.0.0" }
parquet = { version = "=60.0.0" }

# Hashing, errors, logs, configuration and CLI
blake3 = { version = "=1.8.7" }

# API keys (ADR-0100): SHA-256 of the received token, constant-time comparison
# of the digests, randomness of `crible key generate`.
sha2 = { version = "=0.11.1" }
subtle = { version = "=2.6.1" }
getrandom = { version = "=0.4.3" }
thiserror = { version = "=2.0.21" }
anyhow = { version = "=1.0.104" }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
serde = { version = "=1.0.229" }
serde_json = { version = "=1.0.154" }
toml = { version = "=1.1.8+spec-1.1.0" }
clap = { version = "=4.6.7", features = ["derive"] }

# Request identifier generated by the server (ADR-0096, ADR-0098)
uuid = { version = "=1.29.0", features = ["v4"] }

# Tests
proptest = { version = "=1.12.0" }
criterion = { version = "=0.8.2" }
tempfile = { version = "=3.27.0" }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

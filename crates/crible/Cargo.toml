[package]
name = "crible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface of the Crible engine"
license.workspace = true
publish.workspace = true

[[bin]]
name = "crible"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crible-core = { path = "../crible-core" }
crible-encode = { path = "../crible-encode" }
crible-search = { path = "../crible-search" }
crible-server = { path = "../crible-server" }
crible-store = { path = "../crible-store" }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The HTTP client of `crible eval --url`, in a private module of this crate and
# nowhere else (ADR-0131, decision 2). `hyper`, `hyper-util` and
# `http-body-util` are already in `Cargo.lock`, pulled by `axum`; enabling
# `client-legacy` adds `want`, `try-lock` and `futures-channel` there. No TLS,
# no other HTTP client, and the runtime is the `current_thread` one `eval`
# builds: the requests are sequential (decisions 2 and 10).
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio.workspace = true

[features]
# Off by default: it turns on the failpoints of `crible-store` for the test
# build only, so a plain `cargo test` exercises the build without them; the
# tests that arm them live behind it (`search_lecteurs_denses.rs`, ADR-0126,
# decisions 2 and 6). `crible` also depends on `crible-server`, whose own
# `failpoints` feature stays off here: the CLI test reads the store hook alone.
failpoints = ["crible-store/failpoints"]

[dev-dependencies]
# The `API = CLI` proof drives the axum router of the server in the test; the
# crate is already the server's own stack (ADR-0109, decision 3), and the tokio
# runtime it needs is now a direct dependency of this crate (ADR-0131).
axum.workspace = true
arrow.workspace = true
blake3.workspace = true
half.workspace = true
memmap2.workspace = true
parquet.workspace = true
rayon.workspace = true
roaring.workspace = true
rusqlite.workspace = true
# The `key generate` test recomputes the printed digest instead of trusting the
# crate that prints it (ADR-0100).
sha2.workspace = true
# MES-06: the `lexical_latency` harness replicates the collector of
# `crible-search` to count the candidates a segment hands over (block-WAND
# finding of ADR-0091); `tantivy` 0.27 is already the lexical entry of
# `docs/07-stack-et-deploiement.md` and a dependency of `crible-store` and
# `crible-search`, so this adds no crate outside the stack.
tantivy.workspace = true
# The `API = CLI` proof of `ROUTE-RECHERCHE` drives the server router in the
# test, without a socket (ADR-0109, decision 3).
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
zstd.workspace = true

# MES-08: the attach bench times a real `attach` on a clone of the index and
# reads the five stage durations of its report (`docs/04`). Scenario matrix,
# not a criterion function, so `harness = false`.
[[bench]]
name = "attach_cost"
harness = false

[lints]
workspace = true

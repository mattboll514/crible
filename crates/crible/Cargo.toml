[package]
name = "crible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface of the Crible engine"
license.workspace = true
publish.workspace = true

[[bin]]
name = "crible"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crible-core = { path = "../crible-core" }
crible-encode = { path = "../crible-encode" }
crible-search = { path = "../crible-search" }
crible-store = { path = "../crible-store" }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
arrow.workspace = true
blake3.workspace = true
half.workspace = true
parquet.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
zstd.workspace = true

# MES-08: the attach bench times a real `attach` on a clone of the index and
# reads the five stage durations of its report (`docs/04`). Scenario matrix,
# not a criterion function, so `harness = false`.
[[bench]]
name = "attach_cost"
harness = false

[lints]
workspace = true

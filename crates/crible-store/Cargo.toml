[package]
name = "crible-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arc-swap.workspace = true
arrow.workspace = true
blake3.workspace = true
crible-core = { path = "../crible-core" }
half.workspace = true
memmap2.workspace = true
parquet.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
zstd.workspace = true

[features]
default = []
# Manual fault injection, used only by the `INV-03` / `INV-04` tests
# (`CRIBLE_FAILPOINT=<step>`). Never enabled in a release build.
failpoints = []

[dev-dependencies]
tempfile.workspace = true

# MES-15: the commit-cost bench drives `GenerationStore::commit` itself; the
# harness is `harness = false` because the measure is a scenario matrix (N, S),
# not a criterion function. No criterion dependency is added for it.
[[bench]]
name = "commit_cost"
harness = false

[lints]
workspace = true

[project]
name = "crible"
version = "0.1.0"
description = "Batch writer for Crible: writes format v1 batches (Parquet + manifest)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "blake3>=1.0",
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

# `uv_build` ships with uv (see docs/07); the range covers the uv versions of
# the development machine and of the CI, so no build backend is downloaded.
[build-system]
requires = ["uv_build>=0.11.21,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests that launch the binary are excluded by default (ADR-0112). A test
# without its prerequisite is red, not green: `-m server` without `CRIBLE_BIN`
# fails instead of skipping. The Rust job of the CI runs `uv run pytest -m server`.
addopts = "-m 'not server'"
markers = [
    "server: needs the crible binary named by CRIBLE_BIN (ADR-0112)",
]

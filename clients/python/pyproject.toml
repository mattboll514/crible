[project]
name = "crible"
version = "0.1.0"
description = "Batch writer for Crible: writes format v1 batches (Parquet + manifest)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "blake3>=1.0",
    "numpy>=1.26",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

# `uv_build` ships with uv (see docs/07); the range covers the uv versions of
# the development machine and of the CI, so no build backend is downloaded.
[build-system]
requires = ["uv_build>=0.11.21,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
